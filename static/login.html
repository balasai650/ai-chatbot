<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #667eea, #764ba2);
        padding: 20px;
    }

    .login-container {
        width: 100%;
        max-width: 420px;
    }

    .login-card {
        background: rgba(255, 255, 255, 0.97);
        border-radius: 24px;
        padding: 40px;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.25);
    }

    .logo {
        width: 70px;
        height: 70px;
        margin: 0 auto 20px;
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
        font-size: 32px;
    }

    h1 {
        text-align: center;
        color: #222;
        font-size: 28px;
        margin-bottom: 8px;
    }

    .subtitle {
        text-align: center;
        color: #777;
        margin-bottom: 30px;
        font-size: 14px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        color: #333;
        font-size: 14px;
        font-weight: 600;
    }

    input {
        width: 100%;
        padding: 14px 16px;
        border: 1px solid #ddd;
        border-radius: 12px;
        font-size: 15px;
        outline: none;
        transition: 0.2s;
    }

    input:focus {
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
    }

    .login-btn {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s;
    }

    .login-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
    }

    .login-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
    }

    .message {
        display: none;
        margin-bottom: 18px;
        padding: 12px;
        border-radius: 10px;
        text-align: center;
        font-size: 14px;
    }

    .message.error {
        display: block;
        background: #fee2e2;
        color: #b91c1c;
    }

    .message.success {
        display: block;
        background: #dcfce7;
        color: #166534;
    }

    /* Forgot Password */
    .forgot-password {
        text-align: right;
        margin-top: 10px;
        margin-bottom: 20px;
    }

    .forgot-password a {
        color: #667eea;
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
    }

    .forgot-password a:hover {

    .register-link {

        font-size: 14px;

    .register-link a {
        color: #667eea;
        text-decoration: none;
        font-weight: 600;
    }

    .register-link a:hover {
        text-decoration: underline;
    }

    .footer {
        text-align: center;

        font-size: 12px;

    @media (max-width: 480px) {
        .login-card {

```
<div class="login-container">

    <div class="login-card">

        <div class="logo">
            🤖
        </div>

        <h1>Welcome Back</h1>

        <p class="subtitle">
            Sign in to your Dynamic AI Chatbot
        </p>

        <div id="message" class="message"></div>

        <form id="loginForm">

            <div class="form-group">
                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                    autocomplete="username"
                >
            </div>

            <div class="form-group">
                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                    autocomplete="current-password"
                >
            </div>

            <div class="forgot-password">
                <a href="/forgot-password">
                    Forgot Password?
                </a>
            </div>

            <button
                type="submit"
                class="login-btn"
                id="loginButton"
            >
                Sign In
            </button>

        </form>

        <div class="register-link">
            Don't have an account?
            <a href="/register">Create an account</a>
        </div>

    </div>

    <div class="footer">
        Dynamic AI Chatbot • AI-powered conversational assistant
    </div>

</div>

<script>
    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const messageBox = document.getElementById("message");

    function showMessage(text, type) {
        messageBox.textContent = text;
        messageBox.className = "message " + type;
    }

    loginForm.addEventListener("submit", async function(event) {

        event.preventDefault();

        const username = document
            .getElementById("username")
            .value
            .trim();

        const password = document
            .getElementById("password")
            .value;

        if (!username || !password) {
            showMessage(
                "Please enter your username and password.",
                "error"
            );
            return;
        }

        loginButton.disabled = true;
        loginButton.textContent = "Signing in...";

        try {

            const response = await fetch("/api/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    username: username,
                    password: password
                })
            });

            const data = await response.json();

            if (data.success) {

                showMessage(
                    "Login successful! Opening chatbot...",
                    "success"
                );

                setTimeout(function() {
                    window.location.href = "/";
                }, 700);

            } else {

                showMessage(
                    data.message || "Login failed.",
                    "error"
                );

                loginButton.disabled = false;
                loginButton.textContent = "Sign In";
            }

        } catch (error) {

            console.error("Login error:", error);

            showMessage(
                "Unable to connect to the server.",
                "error"
            );

            loginButton.disabled = false;
            loginButton.textContent = "Sign In";
        }
    });
</script>
